# NodePort on the HTTP port so we can curl it directly at
# localhost:30080 without needing `kubectl port-forward` for quick testing.
# gRPC stays ClusterIP-only (port-forward when you need to reach it).
apiVersion: v1
kind: Service
metadata:
  name: crm-core
  namespace: crm-core
spec:
  type: NodePort
  selector:
    app: crm-core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: grpc
      port: 50051
      targetPort: 50051
