# DEV-ONLY placeholder credentials, kept in sync with build/docker-compose.yml
# so local `kubectl apply` behaves the same as `docker compose up`.
#
# Do NOT commit real credentials this way. In a real deployment this Secret
# would instead be created out-of-band (kubectl create secret / a secrets
# manager like Sealed Secrets, External Secrets Operator, or Vault) and never
# checked into git. `stringData` here is plaintext for readability — the API
# server base64-encodes it into `data` automatically.
apiVersion: v1
kind: Secret
metadata:
  name: crm-core-secrets
  namespace: crm-core
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "crm_db"
  DATABASE_URL: "postgres://postgres:password@postgres:5432/crm_db?sslmode=disable"
